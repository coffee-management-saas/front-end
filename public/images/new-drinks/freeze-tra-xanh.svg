<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" role="img" aria-label="Freeze Trà Xanh" fill="none">
  <defs>
    <linearGradient id="gMatcha" x1="100" y1="160" x2="320" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6F7D6"/>
      <stop offset="0.35" stop-color="#BFE8A7"/>
      <stop offset="1" stop-color="#7DC26A"/>
    </linearGradient>
    <linearGradient id="gGlass" x1="120" y1="190" x2="300" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gDust" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(265 110) rotate(10) scale(120 80)">
      <stop offset="0" stop-color="#4F8C3A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4F8C3A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft shadow -->
  <ellipse cx="210" cy="535" rx="135" ry="18" fill="rgba(0,0,0,0.18)"/>

  <!-- cup -->
  <path
    d="M126 210c0-18 14-32 32-32h104c18 0 32 14 32 32l-10 250c-1 28-24 50-52 50H188c-28 0-51-22-52-50l-10-250Z"
    fill="url(#gMatcha)"
    stroke="rgba(255,255,255,0.35)"
    stroke-width="2"
  />

  <!-- matcha layers -->
  <path d="M140 258h240l-6 160c-1 22-19 40-41 40H193c-22 0-40-18-41-40l-6-160Z" fill="rgba(255,255,255,0.12)"/>
  <path d="M144 298h232l-4 92H148l-4-92Z" fill="rgba(40,110,62,0.18)"/>
  <path d="M150 392h220l-3 60H153l-3-60Z" fill="rgba(255,255,255,0.10)"/>

  <!-- glossy highlight -->
  <path
    d="M182 190c-20 10-34 30-33 53l8 206c1 20 14 36 31 42"
    stroke="url(#gGlass)"
    stroke-width="18"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- lid -->
  <path
    d="M150 178c0-20 16-36 36-36h48c20 0 36 16 36 36v12H150v-12Z"
    fill="rgba(255,255,255,0.9)"
    stroke="rgba(255,255,255,0.4)"
    stroke-width="2"
  />

  <!-- whipped cream -->
  <g>
    <circle cx="205" cy="118" r="46" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="245" cy="110" r="40" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="175" cy="138" r="36" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="235" cy="142" r="36" fill="#FFFFFF" opacity="0.92"/>
    <path d="M146 160c8-14 26-22 46-22h76c20 0 38 8 46 22-10 14-28 22-48 22h-72c-20 0-38-8-48-22Z" fill="#F7FBF4" opacity="0.95"/>
  </g>

  <!-- matcha dust -->
  <ellipse cx="248" cy="118" rx="92" ry="52" fill="url(#gDust)"/>
</svg>
